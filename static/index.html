<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LookLabeledData - 训练数据集浏览器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>LookLabeledData</h1>
  <span class="header-sub">训练数据集可视化浏览器</span>
</header>

<div class="layout">

  <aside id="sidebar">
    <section class="panel">
      <h3>数据集类型</h3>
      <div class="tab-group" id="dataset-type-tabs">
        <button class="tab active" data-type="pt">PyTorch (.pt)</button>
        <button class="tab" data-type="coco">COCO</button>
      </div>
    </section>

    <section class="panel">
      <h3>数据路径</h3>
      <div class="path-bar">
        <input type="text" id="path-input" placeholder="/Volumes/data/...">
        <button id="btn-browse">浏览</button>
      </div>
      <div class="path-status" id="path-status">
        <p class="hint">输入路径后点击"浏览"</p>
      </div>
    </section>

    <section class="panel" id="keymap-panel" style="display:none;">
      <h3>键位映射 <span class="hint" id="detect-status"></span></h3>
      <div id="keymap-loading" style="display:none;">检测中...</div>
      <div id="keymap-content">
        <div class="keymap-grid" id="keymap-grid"></div>
        <div class="bbox-mode" id="bbox-mode-row" style="display:none;">
          <label>BBox 格式:</label>
          <select id="bbox-mode">
            <option value="xyxy">xyxy (左上+右下)</option>
            <option value="xywh">xywh (左上+宽高)</option>
          </select>
        </div>
      </div>
    </section>

    <section class="panel">
      <h3>随机抽样</h3>
      <div class="sample-row">
        <input type="number" id="sample-count" value="10" min="1" max="100">
        <button id="btn-random" class="primary">随机抽取</button>
      </div>
      <p class="hint" id="sample-status"></p>
    </section>

    <section class="panel">
      <h3>图层显示</h3>
      <label class="toggle"><input type="checkbox" id="show-bbox" checked> BBox 框</label>
      <label class="toggle"><input type="checkbox" id="show-polygon" checked> 矢量掩码</label>
      <label class="toggle"><input type="checkbox" id="show-keypoint" checked> 关键点</label>
      <label class="toggle"><input type="checkbox" id="show-label" checked> 类别标签</label>
    </section>
  </aside>

  <main id="main-content">
    <div id="canvas-container">
      <div id="image-wrapper">
        <img id="main-image" src="" alt="" style="display:none;">
        <canvas id="overlay-canvas"></canvas>
      </div>
      <div id="no-data-msg" class="placeholder">
        <p>选择一个数据集路径，点击"随机抽取"开始浏览</p>
      </div>
      <div id="info-bar" style="display:none;">
        <span id="info-filename"></span>
        <span id="info-dims"></span>
        <span id="info-annots"></span>
      </div>
    </div>
    <div id="nav-bar" style="display:none;">
      <button id="btn-prev">◀ 上一张</button>
      <span id="nav-index"></span>
      <button id="btn-next">下一张 ▶</button>
      <span id="nav-hint">← → 键切换 | 滚轮缩放 | 拖拽平移</span>
    </div>
    <div id="thumbnail-strip" style="display:none;"></div>
  </main>

</div>

<script>
// ======================================================================
// LookLabeledData – inline JS
// ======================================================================

(function() {
  "use strict";

  // ---- DOM shortcuts ----
  function qs(s)  { return document.querySelector(s); }
  function qsa(s) { return document.querySelectorAll(s); }

  // ---- State ----
  var state = {
    datasetType: "pt",
    currentPath: "",
    keys: [],
    keyMapping: {},
    bboxMode: "xyxy",
    samples: [],
    currentIndex: 0,
    zoom: 1,
    pan: { x: 0, y: 0 },
    dragging: false,
    dragStart: { x: 0, y: 0 },
    layerVis: { bbox: true, polygon: true, keypoint: true, label: true },
    hoveredAnnIdx: -1,
  };

  // ---- El cache ----
  var E = {};
  function cacheEls() {
    var ids = [
      "path-input","btn-browse","path-status",
      "keymap-panel","keymap-loading","keymap-content","keymap-grid",
      "bbox-mode-row","bbox-mode","detect-status",
      "btn-random","sample-count","sample-status",
      "show-bbox","show-polygon","show-keypoint","show-label",
      "canvas-container","image-wrapper","main-image","overlay-canvas",
      "no-data-msg","info-bar","info-filename","info-dims","info-annots",
      "nav-bar","btn-prev","btn-next","nav-index","thumbnail-strip",
    ];
    ids.forEach(function(id) { E[id] = qs("#" + id); });
    E.datasetTabs = qsa("#dataset-type-tabs .tab");
  }
  cacheEls();  // call immediately so E.* is available below

  // ---- API helpers ----
  function apiGet(url) {
    return fetch(url).then(function(r) { return r.json(); });
  }
  function apiPost(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function(r) {
      if (!r.ok) {
        return r.json().catch(function() { return { detail: r.statusText }; })
          .then(function(err) { throw new Error(err.detail || "HTTP " + r.status); });
      }
      return r.json();
    });
  }

  // ---- Dataset type toggle ----
  function updateUIType() {
    var isPT = state.datasetType === "pt";
    E["keymap-panel"].style.display = isPT ? "" : "none";
    if (E["bbox-mode-row"]) E["bbox-mode-row"].style.display = "none";
    state.keys = [];
    state.samples = [];
    resetView();
  }

  E.datasetTabs.forEach(function(tab) {
    tab.addEventListener("click", function() {
      E.datasetTabs.forEach(function(t) { t.classList.remove("active"); });
      tab.classList.add("active");
      state.datasetType = tab.dataset.type;
      updateUIType();
    });
  });

  // ---- Path validation ----
  E["btn-browse"].addEventListener("click", function() { checkPath(E["path-input"].value.trim()); });
  E["path-input"].addEventListener("keydown", function(e) { if (e.key === "Enter") checkPath(E["path-input"].value.trim()); });

  function checkPath(path) {
    if (!path) return;
    state.currentPath = path;
    E["path-input"].value = path;
    E["path-status"].innerHTML = '<span class="spinner"></span> 检测中...';
    apiGet("/api/check-path?path=" + encodeURIComponent(path)).then(function(data) {
      if (data.exists) {
        E["path-status"].innerHTML = '<span style="color:#3cb44b;font-size:1.1rem;">&#10004;</span> <span style="color:#3cb44b;">路径有效</span>';
        E["sample-status"].textContent = "";
      } else {
        E["path-status"].innerHTML = '<span style="color:#e94560;font-size:1.1rem;">&#10008;</span> <span style="color:#e94560;">' + (data.error || "路径不存在") + '</span>';
      }
    }).catch(function(e) {
      E["path-status"].innerHTML = '<span style="color:#e94560;font-size:1.1rem;">&#10008;</span> <span style="color:#e94560;">错误: ' + e.message + '</span>';
    });
  }

  // ---- PT Key detection (unused, kept for reference) ----
  function detectKeys(filePath) {
    var dir = filePath.substring(0, filePath.lastIndexOf("/"));
    var file = filePath.substring(filePath.lastIndexOf("/") + 1);
    E["keymap-loading"].style.display = "";
    E["keymap-content"].style.display = "none";
    E["detect-status"].textContent = "";
    apiPost("/api/pt/detect", { path: dir, file: file }).then(function(data) {
      state.keys = data.keys;
      state.currentPath = dir;
      renderKeyMapping(data.keys);
      E["keymap-loading"].style.display = "none";
      E["keymap-content"].style.display = "";
      E["detect-status"].textContent = "已检测: " + file;
    }).catch(function(e) {
      E["keymap-loading"].style.display = "none";
      E["detect-status"].textContent = "检测失败: " + e.message;
    });
  }

  function detectKeysSilent(filePath) {
    var dir = filePath.substring(0, filePath.lastIndexOf("/"));
    var file = filePath.substring(filePath.lastIndexOf("/") + 1);
    return apiPost("/api/pt/detect", { path: dir, file: file }).then(function(data) {
      state.keys = data.keys;
      var am = {};
      data.keys.forEach(function(k) {
        if (k.suggested_role === "image" && !am.image) am.image = k.name;
        if ((k.suggested_role === "bbox" || k.suggested_role === "bbox_label") && !am.bbox) am.bbox = k.name;
        if (k.suggested_role === "label" && !am.label) am.label = k.name;
        if (k.suggested_role === "mask" && !am.mask) am.mask = k.name;
        if (k.suggested_role === "keypoint" && !am.keypoint) am.keypoint = k.name;
      });
      state.keyMapping = am;
    });
  }

  var ROLES = [
    { value: "", label: "-- 忽略 --" },
    { value: "image", label: "图像" },
    { value: "bbox", label: "BBox" },
    { value: "bbox_label", label: "BBox+类别" },
    { value: "label", label: "类别标签" },
    { value: "mask", label: "掩码" },
    { value: "keypoint", label: "关键点" },
  ];

  function renderKeyMapping(keys) {
    var am = {};
    keys.forEach(function(k) {
      if (k.suggested_role === "image" && !am.image) am.image = k.name;
      if ((k.suggested_role === "bbox" || k.suggested_role === "bbox_label") && !am.bbox) am.bbox = k.name;
      if (k.suggested_role === "label" && !am.label) am.label = k.name;
      if (k.suggested_role === "mask" && !am.mask) am.mask = k.name;
      if (k.suggested_role === "keypoint" && !am.keypoint) am.keypoint = k.name;
    });
    state.keyMapping = am;

    var html = '<div class="keymap-row header"><span class="name">键名</span><span class="shape">形状/类型</span><span>角色</span></div>';
    keys.forEach(function(k) {
      var shapeStr = k.shape ? k.shape.join(" × ") : (k.len !== undefined ? "list[" + k.len + "]" : k.type);
      if (k.dtype) shapeStr += " (" + k.dtype + ")";
      if (k.element_shape) shapeStr += " of " + k.element_shape.join("×");
      var cur = "";
      for (var r in am) { if (am[r] === k.name) { cur = r; break; } }
      var opts = ROLES.map(function(r) {
        return '<option value="' + r.value + '"' + (r.value === cur ? " selected" : "") + '>' + r.label + '</option>';
      }).join("");
      html += '<div class="keymap-row"><span class="name" title="' + k.name + '">' + k.name + '</span><span class="shape">' + shapeStr + '</span><select data-key="' + k.name + '">' + opts + '</select></div>';
    });
    E["keymap-grid"].innerHTML = html;
    E["bbox-mode-row"].style.display = (am.bbox || am.label) ? "flex" : "none";
    qsa("#keymap-grid select").forEach(function(sel) {
      sel.addEventListener("change", function() {
        var kn = sel.dataset.key;
        var role = sel.value;
        for (var r in state.keyMapping) { if (state.keyMapping[r] === kn) delete state.keyMapping[r]; }
        if (role && role !== "bbox_label") state.keyMapping[role] = kn;
        else if (role === "bbox_label") state.keyMapping.bbox = kn;
        E["bbox-mode-row"].style.display = state.keyMapping.bbox ? "flex" : "none";
      });
    });
  }

  // ---- Random Sample ----
  E["btn-random"].addEventListener("click", function() { randomSample(); });

  function randomSample() {
    var path = state.currentPath || E["path-input"].value.trim();
    if (!path) { E["sample-status"].textContent = "请先输入数据路径"; return; }
    state.currentPath = path;
    E["btn-random"].disabled = true;
    E["btn-random"].textContent = "加载中...";
    E["sample-status"].textContent = "";

    if (state.datasetType === "pt") {
      apiGet("/api/browse?path=" + encodeURIComponent(path)).then(function(data) {
        if (data.error) { E["sample-status"].textContent = data.error; resetBtn(); return; }
        var files = data.pt_files.map(function(f) { return f.name; });
        if (files.length === 0) { E["sample-status"].textContent = "没有找到 .pt 文件"; resetBtn(); return; }
        var count = Math.min(parseInt(E["sample-count"].value) || 10, files.length);
        var selected = shuffleSlice(files, count);
        var p = state.keys.length === 0
          ? detectKeysSilent(path + "/" + files[0]).catch(function() {})
          : Promise.resolve();
        p.then(function() { return loadSamples(selected); })
         .then(function() { E["sample-status"].textContent = "已加载 " + state.samples.length + " / " + files.length + " 个文件"; })
         .catch(function(e) { E["sample-status"].textContent = "错误: " + e.message; })
         .finally(resetBtn);
      }).catch(function(e) { E["sample-status"].textContent = "错误: " + e.message; resetBtn(); });
    } else {
      Promise.resolve().then(function() {
        return apiPost("/api/coco/info", { path: path }).catch(function() {
          E["sample-status"].textContent = "未找到 COCO JSON 文件，尝试直接加载...";
        });
      }).then(function() {
        var count = parseInt(E["sample-count"].value) || 10;
        return apiPost("/api/coco/load", { path: path, count: count });
      }).then(function(data) {
        state.samples = data.samples;
        state.currentIndex = 0;
        renderSamples();
      }).catch(function(e) { E["sample-status"].textContent = "错误: " + e.message; })
        .finally(resetBtn);
    }
  }

  function resetBtn() {
    E["btn-random"].disabled = false;
    E["btn-random"].textContent = "随机抽取";
  }

  function shuffleSlice(arr, n) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a.slice(0, n);
  }

  function loadSamples(files) {
    if (!state.currentPath || files.length === 0) return Promise.resolve();
    var km = {};
    for (var r in state.keyMapping) km[r] = state.keyMapping[r];
    if (!km.image) {
      state.keys.forEach(function(k) { if (k.suggested_role === "image" && !km.image) km.image = k.name; });
    }
    E["sample-status"].textContent = "加载中...";
    return apiPost("/api/pt/load", {
      path: state.currentPath,
      files: files,
      image_key: km.image || "",
      bbox_key: km.bbox || "",
      label_key: km.label || "",
      mask_key: km.mask || "",
      keypoint_key: km.keypoint || "",
      bbox_mode: state.bboxMode,
    }).then(function(data) {
      state.samples = data.samples.filter(function(s) { return s.image_url; });
      state.currentIndex = 0;
      renderSamples();
    });
  }

  // ---- Render ----
  function renderSamples() {
    if (state.samples.length === 0) { resetView(); return; }
    E["no-data-msg"].style.display = "none";
    E["nav-bar"].style.display = "flex";
    E["info-bar"].style.display = "flex";
    E["thumbnail-strip"].style.display = "flex";
    state.zoom = 1; state.pan = { x: 0, y: 0 };
    showSample(state.currentIndex);
    renderThumbnails();
  }

  function resetView() {
    state.samples = []; state.currentIndex = 0;
    E["main-image"].style.display = "none"; E["main-image"].src = "";
    E["overlay-canvas"].style.display = "none";
    E["no-data-msg"].style.display = "";
    E["nav-bar"].style.display = "none"; E["info-bar"].style.display = "none";
    E["thumbnail-strip"].style.display = "none"; E["thumbnail-strip"].innerHTML = "";
    state.zoom = 1; state.pan = { x: 0, y: 0 };
  }

  function showSample(idx) {
    if (idx < 0 || idx >= state.samples.length) return;
    state.currentIndex = idx;
    var s = state.samples[idx];
    E["main-image"].style.display = "";
    E["main-image"].src = s.image_url;
    E["overlay-canvas"].style.display = "";
    E["info-filename"].textContent = s.filename;
    E["info-dims"].textContent = s.width + " × " + s.height;
    E["info-annots"].textContent = (s.annotations ? s.annotations.length : 0) + " 个标注";
    E["nav-index"].textContent = (idx + 1) + " / " + state.samples.length;
    qsa("#thumbnail-strip .thumb").forEach(function(t, i) { t.classList.toggle("active", i === idx); });
    E["main-image"].onload = function() { sizeCanvasToImage(); drawOverlay(); };
    E["main-image"].onerror = function() { E["info-filename"].textContent = s.filename + " (图片加载失败)"; };
  }

  function sizeCanvasToImage() {
    var img = E["main-image"];
    var canvas = E["overlay-canvas"];
    var wrapper = E["image-wrapper"];
    var natW = img.naturalWidth, natH = img.naturalHeight;
    if (!natW || !natH) return;
    var maxW = E["canvas-container"].clientWidth * 0.92;
    var maxH = E["canvas-container"].clientHeight * 0.75;
    var ratio = Math.min(maxW / natW, maxH / natH, 1.0);
    var w = Math.round(natW * ratio), h = Math.round(natH * ratio);
    wrapper.style.width = w + "px"; wrapper.style.height = h + "px";
    img.style.width = w + "px"; img.style.height = h + "px";
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    canvas.style.left = "0"; canvas.style.top = "0";
  }

  function renderThumbnails() {
    var html = "";
    for (var i = 0; i < state.samples.length; i++) {
      html += '<img class="thumb' + (i === state.currentIndex ? " active" : "") + '" src="' + state.samples[i].image_url + '" data-idx="' + i + '">';
    }
    E["thumbnail-strip"].innerHTML = html;
    qsa("#thumbnail-strip .thumb").forEach(function(t) {
      t.addEventListener("click", function() { showSample(parseInt(t.dataset.idx)); });
    });
  }

  // ---- Canvas drawing ----
  var CAT_COLORS = [
    "#e6194b","#3cb44b","#ffe119","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6",
    "#bfef45","#fabed4","#469990","#e6beff","#9a6324","#800000","#aaffc3","#808000",
    "#ffd8b1","#000075","#a9a9a9","#000000","#00ffff","#ff00ff","#ffff00","#ff8000","#80ff00",
  ];

  function getColor(catId, alpha) {
    if (catId === undefined || catId === null) catId = 0;
    var hex = CAT_COLORS[catId % CAT_COLORS.length];
    if (alpha === undefined || alpha === 1) return hex;
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  function drawOverlay() {
    var s = state.samples[state.currentIndex];
    if (!s || !s.annotations) return;
    var canvas = E["overlay-canvas"];
    var ctx = canvas.getContext("2d");
    var sx = canvas.width / s.width, sy = canvas.height / s.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (var i = 0; i < s.annotations.length; i++) {
      var ann = s.annotations[i];
      var catId = ann.category_id != null ? ann.category_id : (ann.label != null ? ann.label : 0);
      var color = getColor(catId);
      var hov = i === state.hoveredAnnIdx;
      var lw = hov ? 3 : 1.5;
      var fa = hov ? 0.35 : 0.15;

      // Polygons
      if (state.layerVis.polygon && ann.polygons) {
        ann.polygons.forEach(function(poly) {
          if (poly.length < 3) return;
          ctx.beginPath();
          if (Array.isArray(poly[0])) {
            ctx.moveTo(poly[0][0] * sx, poly[0][1] * sy);
            for (var j = 1; j < poly.length; j++) ctx.lineTo(poly[j][0] * sx, poly[j][1] * sy);
          } else {
            ctx.moveTo(poly[0] * sx, poly[1] * sy);
            for (var j = 2; j < poly.length; j += 2) ctx.lineTo(poly[j] * sx, poly[j+1] * sy);
          }
          ctx.closePath();
          ctx.fillStyle = getColor(catId, fa); ctx.fill();
          ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
        });
      }

      // BBox
      if (state.layerVis.bbox && ann.bbox) {
        var x1 = ann.bbox[0] * sx, y1 = ann.bbox[1] * sy;
        var w = (ann.bbox[2] - ann.bbox[0]) * sx, h = (ann.bbox[3] - ann.bbox[1]) * sy;
        ctx.strokeStyle = hov ? "#fff" : color;
        ctx.lineWidth = lw;
        ctx.strokeRect(x1, y1, w, h);
        if (state.layerVis.label) {
          var lbl = ann.category_name || ann.label || ("#" + catId);
          if (lbl !== undefined) {
            var fs = Math.max(10, Math.min(14, w * 0.3));
            ctx.font = (hov ? "bold " : "") + fs + "px sans-serif";
            var m = ctx.measureText(String(lbl));
            var pad = 3, lh = fs + pad * 2;
            ctx.fillStyle = getColor(catId, 0.85);
            ctx.fillRect(x1, y1 - lh, m.width + pad * 2, lh);
            ctx.fillStyle = "#fff";
            ctx.fillText(String(lbl), x1 + pad, y1 - pad);
          }
        }
      }

      // Keypoints
      if (state.layerVis.keypoint && ann.keypoints) {
        var kpts = Array.isArray(ann.keypoints[0]) ? ann.keypoints : [ann.keypoints];
        kpts.forEach(function(pt) {
          if (Array.isArray(pt) && pt.length >= 2) {
            ctx.beginPath();
            ctx.arc(pt[0] * sx, pt[1] * sy, hov ? 5 : 3, 0, Math.PI * 2);
            ctx.fillStyle = color; ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
          }
        });
      }
    }
  }

  // ---- Navigation ----
  E["btn-prev"].addEventListener("click", function() {
    if (state.currentIndex > 0) showSample(state.currentIndex - 1);
  });
  E["btn-next"].addEventListener("click", function() {
    if (state.currentIndex < state.samples.length - 1) showSample(state.currentIndex + 1);
  });
  document.addEventListener("keydown", function(e) {
    if (state.samples.length === 0) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); if (state.currentIndex > 0) showSample(state.currentIndex - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); if (state.currentIndex < state.samples.length - 1) showSample(state.currentIndex + 1); }
    else if (e.key === "r" && !e.ctrlKey && !e.metaKey) {
      if (document.activeElement === document.body || document.activeElement === E["canvas-container"]) randomSample();
    }
  });

  // ---- Zoom & Pan ----
  E["canvas-container"].addEventListener("wheel", function(e) {
    if (!E["main-image"].src || state.samples.length === 0) return;
    e.preventDefault();
    state.zoom = Math.max(0.1, Math.min(10, state.zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
    applyTransform();
  });
  E["image-wrapper"].addEventListener("mousedown", function(e) {
    if (e.button !== 0) return;
    state.dragging = true;
    state.dragStart = { x: e.clientX - state.pan.x, y: e.clientY - state.pan.y };
    E["image-wrapper"].style.cursor = "grabbing";
  });
  window.addEventListener("mousemove", function(e) {
    if (!state.dragging) return;
    state.pan.x = e.clientX - state.dragStart.x;
    state.pan.y = e.clientY - state.dragStart.y;
    applyTransform();
  });
  window.addEventListener("mouseup", function() {
    state.dragging = false;
    E["image-wrapper"].style.cursor = state.samples.length > 0 ? "grab" : "";
  });
  function applyTransform() {
    E["image-wrapper"].style.transform = "translate(" + state.pan.x + "px, " + state.pan.y + "px) scale(" + state.zoom + ")";
    E["image-wrapper"].style.transformOrigin = "center center";
  }
  E["image-wrapper"].addEventListener("dblclick", function() {
    state.zoom = 1; state.pan = { x: 0, y: 0 };
    applyTransform();
  });

  // ---- Layer toggle ----
  E["show-bbox"].addEventListener("change", function() { state.layerVis.bbox = E["show-bbox"].checked; drawOverlay(); });
  E["show-polygon"].addEventListener("change", function() { state.layerVis.polygon = E["show-polygon"].checked; drawOverlay(); });
  E["show-keypoint"].addEventListener("change", function() { state.layerVis.keypoint = E["show-keypoint"].checked; drawOverlay(); });
  E["show-label"].addEventListener("change", function() { state.layerVis.label = E["show-label"].checked; drawOverlay(); });

  // ---- Canvas hover ----
  E["overlay-canvas"].addEventListener("mousemove", function(e) {
    var s = state.samples[state.currentIndex];
    if (!s || !s.annotations) return;
    var rect = E["overlay-canvas"].getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var sx = E["overlay-canvas"].width / s.width, sy = E["overlay-canvas"].height / s.height;
    var found = -1;
    for (var i = s.annotations.length - 1; i >= 0; i--) {
      var ann = s.annotations[i];
      if (ann.bbox) {
        if (mx >= ann.bbox[0]*sx && mx <= ann.bbox[2]*sx && my >= ann.bbox[1]*sy && my <= ann.bbox[3]*sy) {
          found = i; break;
        }
      }
    }
    if (found !== state.hoveredAnnIdx) {
      state.hoveredAnnIdx = found;
      E["overlay-canvas"].style.cursor = found >= 0 ? "pointer" : "crosshair";
      drawOverlay();
    }
  });
  E["overlay-canvas"].addEventListener("mouseleave", function() {
    if (state.hoveredAnnIdx !== -1) { state.hoveredAnnIdx = -1; drawOverlay(); }
  });

  // ---- BBox mode ----
  E["bbox-mode"].addEventListener("change", function() { state.bboxMode = E["bbox-mode"].value; });

  // ---- Resize ----
  window.addEventListener("resize", function() {
    if (state.samples.length > 0) { sizeCanvasToImage(); drawOverlay(); }
  });

  console.log("[LookLabeledData] JS initialized OK, " + Object.keys(E).length + " DOM elements cached");
})();
</script>
